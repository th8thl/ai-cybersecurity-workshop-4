name: Session 4 workshop checks
on: [push, pull_request]
jobs:
  workshop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [starter, solution]
    defaults:
      run:
        working-directory: ${{ matrix.version }}
    env:
      DJANGO_SECRET_KEY: ci-disposable-verification-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.version }}/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test tests.test_file_uploads
      - run: python scripts/run_sast.py --examples
      - run: python scripts/compare_nemo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-scan-${{ matrix.version }}
          path: ${{ matrix.version }}/results/examples/current/
